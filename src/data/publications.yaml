# - title: Paper title
#   authors: [First Author, António Fernandes, Third Author]
#   venue: Journal or conference name
#   year: 2026
#   type: journal            # journal | conference | preprint | thesis | other
#   selected: true           # optional: also show it on the home page
#   teaser: /images/papers/example.png   # optional: figure for the home page
#   links:                   # all optional
#     pdf: /files/papers/example.pdf     # files go in public/files/...
#     bibtex: /files/papers/example.bib
#     doi: https://doi.org/...
#     code: https://github.com/...
#     slides: ...
#     video: ...
#     website: ...

